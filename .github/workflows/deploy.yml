name: Deployment Provider Check

on:
  workflow_dispatch: {}

jobs:
  test:
    name: Run Tests Before Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emdc_test
          POSTGRES_USER: emdc_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./emdcbackend
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run Django tests
        working-directory: ./emdcbackend
        env:
          POSTGRES_DB: emdc_test
          POSTGRES_USER: emdc_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key-for-ci-cd-pipeline-only
          DEBUG: 1
        run: |
          python manage.py test emdcbackend.test --verbosity=2

