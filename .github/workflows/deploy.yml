  health-check:
    name: Post-deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check API health
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "❌ API_URL is required after a deployment provider is configured"
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "❌ API_URL must use HTTPS"; exit 1 ;;
          esac

          response=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 15 "${API_URL%/}/api/health/" || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed with status code: $response"
            exit 1
          fi

